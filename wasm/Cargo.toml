# Standalone workspace root so this crate is fully decoupled from the parent
# saql-editor package (it nests inside that repo but builds independently).
[workspace]

[package]
name = "saql-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the SAQL engine — runs SQL entirely in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, via path deps into the sibling ../saql checkout (same as the server).
saql-core = { path = "../../saql/crates/saql-core" }
saql-connectors = { path = "../../saql/crates/saql-connectors" }
# Must match saql-core's arrow major version so RecordBatch types unify.
arrow = "53"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# ahash (pulled in by arrow) needs a randomness source; on wasm that's the
# browser's Crypto API. Enabling `wasm_js` + the cfg in .cargo/config.toml wires
# it up. Without this the build fails with "no getrandom backend".
getrandom = { version = "0.3", features = ["wasm_js"] }

# Small, fast-loading wasm: optimize for size and strip symbols.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
